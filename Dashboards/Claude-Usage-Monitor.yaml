type: vertical-stack
cards:

  # ── Header Banner ──────────────────────────────────────────────────────
  - type: custom:button-card
    name: Claude Usage Monitor
    icon: mdi:robot-outline
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - background: "linear-gradient(135deg, #1a0533 0%, #2d1050 50%, #1a0533 100%)"
        - border: "1px solid #7b2fbf"
        - border-radius: 12px
        - padding: 16px 20px
      name:
        - font-size: 22px
        - font-weight: "700"
        - letter-spacing: 2px
        - text-transform: uppercase
        - color: "#cc85f5"
      icon:
        - color: "#b668f5"
        - width: 36px

  # ── Graph Row: Session & Weekly Usage ──────────────────────────────────
  - type: horizontal-stack
    cards:
      - type: custom:mini-graph-card
        entities:
          - entity: sensor.claude_usage_monitor_session_usage
            name: Session
        name: Session Usage
        icon: mdi:timer-sand
        graph: bar
        hours_to_show: 6
        points_per_hour: 6
        show:
          name: true
          icon: true
          state: true
          graph: true
          labels: false
          average: false
          extrema: false
        color_thresholds:
          - value: 0
            color: "#43a047"
          - value: 60
            color: "#fb8c00"
          - value: 85
            color: "#e53935"
        style: |
          ha-card {
            background: linear-gradient(135deg, #1a0533 0%, #2d1050 100%);
            border: 1px solid #7b2fbf;
            border-radius: 12px;
          }

      - type: custom:mini-graph-card
        entities:
          - entity: sensor.claude_usage_monitor_week_usage
            name: Weekly
        name: Week Usage
        icon: mdi:calendar-week
        graph: bar
        hours_to_show: 72
        points_per_hour: 1
        show:
          name: true
          icon: true
          state: true
          graph: true
          labels: false
          average: false
          extrema: false
        color_thresholds:
          - value: 0
            color: "#43a047"
          - value: 60
            color: "#fb8c00"
          - value: 85
            color: "#e53935"
        style: |
          ha-card {
            background: linear-gradient(135deg, #1a0533 0%, #2d1050 100%);
            border: 1px solid #7b2fbf;
            border-radius: 12px;
          }

  # ── Stat Tiles: Pace / Extra Usage / API Status ────────────────────────
  - type: horizontal-stack
    cards:
      - type: custom:button-card
        entity: sensor.claude_usage_monitor_week_usage_pace
        name: Weekly Pace
        icon: mdi:speedometer
        show_state: true
        state_display: "[[[ return parseFloat(entity.state).toFixed(1) + '%' ]]]"
        tap_action:
          action: none
        styles:
          card:
            - background: "linear-gradient(135deg, #1a0533 0%, #2d1050 100%)"
            - border: "1px solid #7b2fbf"
            - border-radius: 12px
            - padding: 14px 10px
          name:
            - color: "#cc85f5"
            - font-size: 12px
            - letter-spacing: 1px
            - text-transform: uppercase
          state:
            - font-size: 22px
            - font-weight: "700"
          icon:
            - width: 28px
        state:
          - operator: "<="
            value: "-0.1"
            styles:
              state:
                - color: "#43a047"
              icon:
                - color: "#43a047"
          - operator: ">="
            value: "0"
            styles:
              state:
                - color: "#fb8c00"
              icon:
                - color: "#fb8c00"

      - type: custom:button-card
        entity: sensor.claude_usage_monitor_extra_usage
        name: Extra Usage
        icon: mdi:credit-card-outline
        show_state: true
        state_display: "[[[ return parseFloat(entity.state).toFixed(1) + '%' ]]]"
        tap_action:
          action: none
        custom_fields:
          credits: >
            [[[
              return states['sensor.claude_usage_monitor_extra_usage_credits'].state
                + ' / '
                + states['sensor.claude_usage_monitor_extra_usage_limit'].state
                + ' credits';
            ]]]
        styles:
          card:
            - background: "linear-gradient(135deg, #1a0533 0%, #2d1050 100%)"
            - border: "1px solid #7b2fbf"
            - border-radius: 12px
            - padding: 14px 10px
          name:
            - color: "#cc85f5"
            - font-size: 12px
            - letter-spacing: 1px
            - text-transform: uppercase
          state:
            - font-size: 22px
            - font-weight: "700"
            - color: "#cc85f5"
          icon:
            - color: "#b668f5"
            - width: 28px
          custom_fields:
            credits:
              - color: "#9e9e9e"
              - font-size: 11px
              - padding-top: 4px

      - type: custom:button-card
        entity: sensor.claude_usage_monitor_api_error
        name: API Status
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - background: "linear-gradient(135deg, #1a0533 0%, #2d1050 100%)"
            - border: "1px solid #7b2fbf"
            - border-radius: 12px
            - padding: 14px 10px
          name:
            - font-size: 12px
            - letter-spacing: 1px
            - text-transform: uppercase
          icon:
            - width: 28px
        state:
          - value: "0"
            name: API OK
            icon: mdi:check-circle-outline
            styles:
              icon:
                - color: "#43a047"
              name:
                - color: "#43a047"
          - operator: default
            name: API Error
            icon: mdi:alert-circle-outline
            styles:
              icon:
                - color: "#e53935"
              name:
                - color: "#e53935"

  # ── Reset Countdown Row ────────────────────────────────────────────────
  - type: horizontal-stack
    cards:
      - type: custom:mushroom-template-card
        primary: Session Resets
        secondary: >
          {{ relative_time(as_datetime(states('sensor.claude_usage_monitor_session_reset_time'))) }}
        icon: mdi:timer-refresh
        icon_color: purple
        tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #1a0533 0%, #2d1050 100%);
              border: 1px solid #7b2fbf;
              border-radius: 12px;
            }

      - type: custom:mushroom-template-card
        primary: Week Resets
        secondary: >
          {{ relative_time(as_datetime(states('sensor.claude_usage_monitor_weekly_reset_time'))) }}
        icon: mdi:calendar-clock
        icon_color: purple
        tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #1a0533 0%, #2d1050 100%);
              border: 1px solid #7b2fbf;
              border-radius: 12px;
            }

      - type: custom:mushroom-template-card
        primary: Extra Usage
        secondary: >
          {% if states('sensor.claude_usage_monitor_extra_usage_enabled') == 'True' %}
            Enabled — {{ states('sensor.claude_usage_monitor_extra_usage_credits') }} credits used
          {% else %}
            Disabled
          {% endif %}
        icon: mdi:credit-card-outline
        icon_color: >
          {% if states('sensor.claude_usage_monitor_extra_usage_enabled') == 'True' %}
            purple
          {% else %}
            grey
          {% endif %}
        tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(135deg, #1a0533 0%, #2d1050 100%);
              border: 1px solid #7b2fbf;
              border-radius: 12px;
            }
