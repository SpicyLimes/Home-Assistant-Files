blueprint:
  name: IKEA BILRESA Remote with Scroll Wheel (Zigbee2MQTT)
  description: |
    Control actions for the IKEA BILRESA remote control with scroll wheel (E2490)
    via Zigbee2MQTT.

    IMPORTANT - how this remote actually behaves:

    The SCROLL WHEEL is the only button that reports to Zigbee2MQTT. It is both a
    dial and a clickable button. The small bottom button sends NOTHING to the
    network; it only cycles which bound group the remote controls locally.

      | Press          | Zigbee2MQTT action            |
      | -------------- | ----------------------------- |
      | Single click   | alternating "on" / "off"      |
      | Double click   | "on_double"                   |
      | Triple click   | "off_double"                  |
      | Quad+ / Long   | nothing                       |
      | Rotate         | n x "brightness_move_to_level"|
      | Bottom button  | nothing                       |

    THIS IS NOT THE E2489. The dual-button BILRESA is a different device with
    mirror-opposite capabilities, and blueprints written for it will not work
    here:

      |               | E2489 dual button        | E2490 scroll wheel (this) |
      | ------------- | ------------------------ | ------------------------- |
      | Long press    | brightness_move_up/down  | nothing                   |
      |               | + brightness_stop        |                           |
      | Triple press  | nothing                  | off_double                |
      | Rotation      | n/a                      | brightness_move_to_level  |

    The button below the LEDs cycles the remote's three product groups, and the
    lit LED count shows which is selected. Over Zigbee this is invisible to the
    coordinator: actions do not identify the selected group, so Home Assistant
    cannot tell groups apart and cannot see the button press itself. Groups 2
    and 3 also stay locked until unlocked through Touchlink. Only Matter over
    Thread exposes the three groups separately, as nine endpoints.

    Single clicks ALTERNATE. The remote stores an on/off state per channel and
    sends On, then Off, then On, and so on. It never sends Toggle. This keeps
    group members in sync with each other, but it desynchronises if you also
    control the lights from Home Assistant: the remote does not know you changed
    anything, so the next click may send the state the light is already in.

      - For behaviour that survives desync, put light.toggle in "Any Single
        Click" and leave the On/Off phase slots empty.
      - For strict on/off, use the On Phase and Off Phase slots instead, and
        accept that the remote can get one click out of step.

    Despite the names Zigbee2MQTT uses, "on_double" is a DOUBLE click and
    "off_double" is a TRIPLE click. They are not two different buttons.

    Long-pressing generates no Zigbee events at all - this is confirmed device
    behaviour, not a pairing fault.

    The wheel reports an ABSOLUTE level, not a relative step, so it acts as a
    dial. The level is stored on the remote and shared across all channels.

    Zigbee pairing (this remote ships as Matter over Thread; Zigbee mode is hidden
    and unofficial - IKEA could remove it in an OTA update):
      1. Hold the pair button (under the battery cover) ~10s until LEDs pulse amber.
      2. Move it away from other IKEA devices, or power them off.
      3. Press the pair button 4 times to enter Touchlink.
      4. Press the pair button 8 times to join the Zigbee network.
         LEDs turn off; there is no success indicator.

    Notes: the buttons have low click sensitivity, so press firmly. Clicks carry a
    built-in ~0.5s delay while the remote decides between single, double and triple.
    The remote sleeps to save power and will not answer Zigbee2MQTT commands until
    a button wakes it.
  author: SpicyLimes
  source_url: https://github.com/SpicyLimes/Home-Assistant-Files/blob/main/Blueprints/Automations/Z2M-IKEA-BILRESA-E2490-Controller.yaml
  domain: automation
  input:
    remote_topic:
      name: Zigbee2MQTT State Topic
      description: >
        The MQTT state topic for this remote: base topic plus the device's friendly
        name, e.g. "zigbee2mqtt/My Remote Name". No trailing slash, no "/action".
      selector:
        text:

    any_click_actions:
      name: Wheel - Any Single Click
      description: >
        Runs on EVERY single click of the wheel, whether the remote sent "on" or
        "off". This is usually what you want - pair it with light.toggle and the
        remote cannot drift out of step. Leave the two phase slots below empty if
        you use this.
      default: []
      selector:
        action: {}

    on_actions:
      name: Wheel - Single Click, On Phase
      description: >
        Runs only when the single click sent "on". Use this with the Off Phase slot
        for strict on/off control. Remember the remote alternates blindly, so this
        can fall out of step if you control the lights elsewhere.
      default: []
      selector:
        action: {}

    off_actions:
      name: Wheel - Single Click, Off Phase
      description: Runs only when the single click sent "off".
      default: []
      selector:
        action: {}

    on_double_actions:
      name: Wheel - Double Click
      description: >
        Runs on a double click (Zigbee2MQTT reports this as "on_double").
        When bound directly, this recalls the NEXT scene on IKEA bulbs.
      default: []
      selector:
        action: {}

    off_double_actions:
      name: Wheel - Triple Click
      description: >
        Runs on a TRIPLE click (Zigbee2MQTT confusingly reports this as
        "off_double"). When bound directly, this recalls the PREVIOUS scene on
        IKEA bulbs.
      default: []
      selector:
        action: {}

    wheel_lights:
      name: Wheel Rotation - Lights to Dim
      description: >
        Optional. Lights whose brightness follows the wheel. The reported level
        maps directly onto Home Assistant brightness, clamped to 1-254.
      default: {}
      selector:
        target:
          entity:
            domain: light

    wheel_transition:
      name: Wheel Rotation - Transition Time
      description: >
        Fade time in seconds when the wheel sets brightness. Keep it small; the
        remote emits events every 100-300 ms while turning.
      default: 0.3
      selector:
        number:
          min: 0.0
          max: 5.0
          step: 0.1
          unit_of_measurement: seconds
          mode: slider

    wheel_actions:
      name: Wheel Rotation - Custom Actions
      description: >
        Optional extra actions on each wheel movement. Variables "wheel_level"
        (1-254) and "wheel_percent" (0-100) are available.
      default: []
      selector:
        action: {}

# The wheel emits a burst of events while turning. Queued keeps them in order so the
# final brightness matches where the wheel stopped; silent overflow avoids log spam.
mode: queued
max: 25
max_exceeded: silent

triggers:
  - trigger: mqtt
    topic: !input remote_topic
    id: remote

variables:
  wheel_targets: !input wheel_lights
  # action_level exists ONLY on rotation payloads. Variables render BEFORE
  # conditions, so dereferencing it unguarded raises UndefinedError and silently
  # aborts the whole run for every click action. default(0) keeps these safe.
  wheel_level: "{{ (trigger.payload_json.action_level | default(0)) | int(0) }}"
  wheel_percent: "{{ ((((trigger.payload_json.action_level | default(0)) | int(0)) / 254) * 100) | round(0) | int(0) }}"
  # No channel/group variable is provided on purpose: over Zigbee the remote
  # does not identify which of its three product groups is selected, so
  # action_group is effectively a constant and cannot be used to branch.
  # 'on' or 'off' for a single click; empty for every other action.
  click_state: >-
    {{ trigger.payload_json.action if trigger.payload_json.action | default('') in ['on', 'off'] else '' }}

conditions:
  # This topic also carries battery and link-quality updates with no action.
  - condition: template
    value_template: >
      {{ trigger.payload_json.action is defined
         and trigger.payload_json.action not in [none, ''] }}

actions:
  - choose:
      # Single clicks alternate on/off. The "any click" slot runs inside BOTH
      # phases. Note: an empty `sequence:` is valid, but an empty `then:` is not,
      # so these must be nested sequences rather than an if/then wrapper.
      - alias: Single click - on phase
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'on' }}"
        sequence:
          - alias: Any single click
            sequence: !input any_click_actions
          - alias: On phase only
            sequence: !input on_actions

      - alias: Single click - off phase
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'off' }}"
        sequence:
          - alias: Any single click
            sequence: !input any_click_actions
          - alias: Off phase only
            sequence: !input off_actions

      - alias: Double click
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'on_double' }}"
        sequence: !input on_double_actions

      - alias: Triple click
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'off_double' }}"
        sequence: !input off_double_actions

      - alias: Wheel rotation
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'brightness_move_to_level' }}"
        sequence:
          - alias: Apply the wheel level to the selected lights
            if:
              - condition: template
                value_template: "{{ wheel_targets | default({}, true) | count > 0 }}"
            then:
              # The remote can report 255, which is undefined for lights; 254 is max.
              - action: light.turn_on
                target: !input wheel_lights
                data:
                  brightness: "{{ [[wheel_level, 1] | max, 254] | min }}"
                  transition: !input wheel_transition
          - alias: Custom wheel actions
            sequence: !input wheel_actions
    default: []
