blueprint:
  name: IKEA BILRESA Remote with Scroll Wheel (Zigbee2MQTT)
  description: |
    Control actions for the IKEA BILRESA remote control with scroll wheel (E2490)
    via Zigbee2MQTT.

    IMPORTANT - how this remote actually behaves:

    The SCROLL WHEEL is the only button that reports to Zigbee2MQTT. It is both a
    dial and a clickable button. The small bottom button sends NOTHING to the
    network; it only cycles which bound group the remote controls locally.

      | Press          | Zigbee2MQTT action            |
      | -------------- | ----------------------------- |
      | Single click   | alternating "on" / "off"      |
      | Double click   | "on_double"                   |
      | Triple click   | "off_double"                  |
      | Quad+ / Long   | nothing                       |
      | Rotate         | n x "brightness_move_to_level"|
      | Bottom button  | nothing                       |

    THIS IS NOT THE E2489. The dual-button BILRESA is a different device with
    mirror-opposite capabilities, and blueprints written for it will not work
    here:

      |               | E2489 dual button        | E2490 scroll wheel (this) |
      | ------------- | ------------------------ | ------------------------- |
      | Long press    | brightness_move_up/down  | nothing                   |
      |               | + brightness_stop        |                           |
      | Triple press  | nothing                  | off_double                |
      | Rotation      | n/a                      | brightness_move_to_level  |

    The button below the LEDs cycles the remote's three product groups, and the
    lit LED count shows which is selected. Over Zigbee this is invisible to the
    coordinator: actions do not identify the selected group, so Home Assistant
    cannot tell groups apart and cannot see the button press itself. Only Matter
    over Thread exposes the three groups separately, as nine endpoints.

    Single clicks ALTERNATE. The remote stores an on/off state per channel and
    sends On, then Off, then On, and so on. It never sends Toggle. This keeps
    group members in sync with each other, but it desynchronises if you also
    control the lights from Home Assistant.

      - For behaviour that survives desync, put light.toggle in "Any Single
        Click" and leave the On/Off phase slots empty.
      - For strict on/off, use the On Phase and Off Phase slots instead.

    ------------------------------------------------------------------------
    ROTATION: ABSOLUTE vs RELATIVE
    ------------------------------------------------------------------------

    ABSOLUTE (default) uses the level the remote reports (1-255) directly. The
    wheel behaves as a dial with a fixed position. Simple, needs no extra setup,
    but the remote does not know if you changed the light elsewhere, so the next
    turn snaps to the remote's own stored position.

    RELATIVE steps up or down by how far you turned, so it never snaps and never
    desynchronises. A quick flick moves further than a slow nudge.

    *** RELATIVE REQUIRES ONE SETTING IN ZIGBEE2MQTT ***
    Open the device in Zigbee2MQTT -> Settings (specific) and put numbers in the
    "Simulated brightness" Delta and Interval boxes (20 and 100 are fine). There
    is no checkbox; the feature counts as enabled once the values exist. That
    makes Zigbee2MQTT add "action_brightness_delta" to every rotation payload,
    which is what relative mode reads. Without it, relative mode does nothing.
    The Delta and Interval numbers themselves are ignored by this device - only
    devices that send brightness_move_up/down use them.

    Two measured quirks relative mode handles for you:
      - The FIRST rotation after a Zigbee2MQTT restart reports a bogus delta,
        because it is diffed against a seed of 255. "Max Delta" bounds the
        damage to a single oversized step.
      - At the extremes the remote clamps at 255 or 1 and keeps transmitting
        with a delta of 0. The level is used to infer direction there, and
        "Rail Step" sets how far each of those events moves.

    ------------------------------------------------------------------------
    SCROLL MODES
    ------------------------------------------------------------------------

    The wheel can drive brightness, colour temperature or hue. Point "Scroll
    Mode Helper" at an input_select whose options are any of:

        brightness    color_temp    hue

    Turn on "Triple Click Cycles Mode" and a triple click steps to the next
    option, wrapping around. Double click stays free for your own actions.

    With no helper the mode is fixed to "Fallback Scroll Mode".

    Colour temperature and hue read the CURRENT value from the first entity in
    your rotation target, so that target must include at least one entity (not
    only areas or devices).

    Notes: the buttons have low click sensitivity, so press firmly. Clicks carry
    a built-in ~0.5s delay while the remote decides between single, double and
    triple. The remote sleeps to save power and will not answer Zigbee2MQTT
    commands until a button wakes it.
  author: SpicyLimes
  source_url: https://github.com/SpicyLimes/Home-Assistant-Files/blob/main/Blueprints/Automations/Z2M-IKEA-BILRESA-E2490-Controller.yaml
  domain: automation
  input:
    remote_topic:
      name: Zigbee2MQTT State Topic
      description: >
        The MQTT state topic for this remote: base topic plus the device's friendly
        name, e.g. "zigbee2mqtt/My Remote Name". No trailing slash, no "/action".
      selector:
        text:

    any_click_actions:
      name: Wheel - Any Single Click
      description: >
        Runs on EVERY single click of the wheel, whether the remote sent "on" or
        "off". Pair it with light.toggle and the remote cannot drift out of step.
      default: []
      selector:
        action: {}

    on_actions:
      name: Wheel - Single Click, On Phase
      description: Runs only when the single click sent "on".
      default: []
      selector:
        action: {}

    off_actions:
      name: Wheel - Single Click, Off Phase
      description: Runs only when the single click sent "off".
      default: []
      selector:
        action: {}

    on_double_actions:
      name: Wheel - Double Click
      description: Runs on a double click (Zigbee2MQTT reports this as "on_double").
      default: []
      selector:
        action: {}

    off_double_actions:
      name: Wheel - Triple Click
      description: >
        Runs on a TRIPLE click (Zigbee2MQTT reports this as "off_double").
        Ignored when "Triple Click Cycles Mode" is on.
      default: []
      selector:
        action: {}

    rotation_mode:
      name: Rotation Behaviour
      description: >
        "absolute" uses the reported level as a dial position. "relative" steps by
        how far you turned and never desynchronises, but needs Simulated
        Brightness enabled in Zigbee2MQTT (see the description above).
      default: absolute
      selector:
        select:
          options:
            - label: Absolute - dial position (no extra setup)
              value: absolute
            - label: Relative - proportional steps (needs Simulated Brightness)
              value: relative

    wheel_lights:
      name: Rotation - Lights to Control
      description: >
        Lights the wheel adjusts. For colour temp and hue modes this must include
        at least one entity, since the current value is read from the first one.
      default: {}
      selector:
        target:
          entity:
            domain: light

    wheel_transition:
      name: Rotation - Transition Time
      description: >
        Fade time in seconds. Keep it small; the remote emits events every
        100-300 ms while turning.
      default: 0.3
      selector:
        number:
          min: 0.0
          max: 5.0
          step: 0.1
          unit_of_measurement: seconds
          mode: slider

    scroll_mode_helper:
      name: Scroll Mode Helper
      description: >
        Optional input_select whose options are drawn from: brightness,
        color_temp, hue. Leave empty to use the fallback mode below.
      default: ""
      selector:
        entity:
          domain: input_select

    fallback_scroll_mode:
      name: Fallback Scroll Mode
      description: Used when no helper is set, or the helper is unavailable.
      default: brightness
      selector:
        select:
          options:
            - label: Brightness
              value: brightness
            - label: Colour Temperature
              value: color_temp
            - label: Hue
              value: hue

    cycle_mode_on_triple:
      name: Triple Click Cycles Mode
      description: >
        When on, a triple click advances the helper to its next option and the
        Triple Click action slot is not run.
      default: false
      selector:
        boolean:

    sensitivity_brightness:
      name: Sensitivity - Brightness
      description: >
        100% means a full sweep of the wheel spans the full brightness range.
        Relative mode only.
      default: 100
      selector:
        number: {min: 10, max: 300, step: 5, unit_of_measurement: "%", mode: slider}

    sensitivity_color_temp:
      name: Sensitivity - Colour Temperature
      description: 100% means a full sweep spans the light's whole Kelvin range.
      default: 100
      selector:
        number: {min: 10, max: 300, step: 5, unit_of_measurement: "%", mode: slider}

    sensitivity_hue:
      name: Sensitivity - Hue
      description: 100% means a full sweep travels once around the colour wheel.
      default: 100
      selector:
        number: {min: 10, max: 300, step: 5, unit_of_measurement: "%", mode: slider}

    max_delta:
      name: Relative - Max Delta
      description: >
        Caps how far one event may move, in the remote's 0-255 units. This is what
        bounds the bogus first reading after a Zigbee2MQTT restart. Measured real
        turns ranged about 14 (gentle) to 70 (fast).
      default: 60
      selector:
        number: {min: 5, max: 255, step: 5, mode: slider}

    rail_delta:
      name: Relative - Rail Step
      description: >
        How far to move per event while the wheel is pinned at its maximum or
        minimum, where the remote reports a delta of 0. Set to 0 to ignore those.
      default: 10
      selector:
        number: {min: 0, max: 60, step: 1, mode: slider}

    min_brightness:
      name: Minimum Brightness
      description: Scrolling down will not take the light below this (1-254).
      default: 3
      selector:
        number: {min: 1, max: 254, step: 1, mode: slider}

    wheel_actions:
      name: Rotation - Custom Actions
      description: >
        Extra actions on each wheel movement. Variables available: wheel_level
        (1-255), raw_delta, direction (-1/0/1), frac (-1.0..1.0) and scroll_mode.
      default: []
      selector:
        action: {}

# The wheel emits a burst of events while turning. Queued keeps them in order so the
# final value matches where the wheel stopped; silent overflow avoids log spam.
mode: queued
max: 25
max_exceeded: silent

triggers:
  - trigger: mqtt
    topic: !input remote_topic
    id: remote

variables:
  wheel_targets: !input wheel_lights
  rot_mode: !input rotation_mode
  mode_helper: !input scroll_mode_helper
  fallback_mode: !input fallback_scroll_mode
  cycle_on_triple: !input cycle_mode_on_triple
  cap_delta: !input max_delta
  rail_step: !input rail_delta
  min_bri: !input min_brightness
  sens_bri: !input sensitivity_brightness
  sens_ct: !input sensitivity_color_temp
  sens_hue: !input sensitivity_hue

  # action_level exists ONLY on rotation payloads, and action_brightness_delta only
  # when Simulated Brightness is enabled. Variables render BEFORE conditions, so
  # dereferencing either unguarded raises UndefinedError and silently aborts the
  # whole run for every click action. default(0) keeps these safe.
  wheel_level: "{{ (trigger.payload_json.action_level | default(0)) | int(0) }}"
  raw_delta: "{{ (trigger.payload_json.action_brightness_delta | default(0)) | int(0) }}"
  click_state: >-
    {{ trigger.payload_json.action if trigger.payload_json.action | default('') in ['on', 'off'] else '' }}

  # First entity of the rotation target, used to read current colour temp / hue.
  ref_entity: >-
    {% set ids = (wheel_targets | default({}, true)).entity_id | default([]) %}
    {% set ids = [ids] if ids is string else ids %}
    {{ ids[0] if (ids | count) > 0 else '' }}

  scroll_mode: >-
    {{ states(mode_helper) if mode_helper not in [none, ''] and states(mode_helper) in ['brightness', 'color_temp', 'hue'] else fallback_mode }}

  # +1 up, -1 down, 0 ignore. At the rails the remote reports delta 0 while still
  # transmitting, so the clamped level tells us which way it is pinned.
  direction: >-
    {{ 1 if raw_delta > 0 else (-1 if raw_delta < 0 else (1 if wheel_level >= 255 else (-1 if wheel_level <= 1 else 0))) }}

  # Magnitude in 0-255 units, capped; rails substitute the fixed rail step.
  eff_delta: >-
    {{ (rail_step | int(0)) if raw_delta == 0 else ([(raw_delta | abs), (cap_delta | int(60))] | min) }}

  # Signed fraction of full scale, -1.0 .. 1.0
  frac: "{{ (direction | int(0)) * (eff_delta | int(0)) / 255 }}"

conditions:
  # This topic also carries battery and link-quality updates with no action.
  - condition: template
    value_template: >
      {{ trigger.payload_json.action is defined
         and trigger.payload_json.action not in [none, ''] }}

actions:
  - choose:
      # Single clicks alternate on/off. The "any click" slot runs inside BOTH
      # phases. Note: an empty `sequence:` is valid, but an empty `then:` is not,
      # so these must be nested sequences rather than an if/then wrapper.
      - alias: Single click - on phase
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'on' }}"
        sequence:
          - alias: Any single click
            sequence: !input any_click_actions
          - alias: On phase only
            sequence: !input on_actions

      - alias: Single click - off phase
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'off' }}"
        sequence:
          - alias: Any single click
            sequence: !input any_click_actions
          - alias: Off phase only
            sequence: !input off_actions

      - alias: Double click
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'on_double' }}"
        sequence: !input on_double_actions

      - alias: Triple click - cycle scroll mode, or run the triple click actions
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'off_double' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ cycle_on_triple and mode_helper not in [none, ''] }}"
            then:
              # Templated rather than `!input` directly: the input defaults to an
              # empty string, and HA validates entity_id at blueprint-instantiation
              # time, which would make every automation using the defaults fail to
              # load. A template defers resolution to runtime, behind the guard above.
              - action: input_select.select_next
                target:
                  entity_id: "{{ mode_helper }}"
                data:
                  cycle: true
            else:
              - alias: Triple click actions
                sequence: !input off_double_actions

      - alias: Wheel rotation
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'brightness_move_to_level' }}"
        sequence:
          - alias: Apply the rotation to the selected lights
            if:
              - condition: template
                value_template: >
                  {{ (wheel_targets | default({}, true) | count > 0)
                     and (rot_mode == 'absolute' or (direction | int(0)) != 0) }}
            then:
              - choose:
                  # ---- ABSOLUTE: the reported level is the dial position ----
                  - alias: Absolute - brightness
                    conditions:
                      - condition: template
                        value_template: "{{ rot_mode == 'absolute' and scroll_mode == 'brightness' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input wheel_lights
                        data:
                          # The remote can report 255, undefined for lights; 254 is max.
                          brightness: "{{ [[wheel_level, min_bri | int(1)] | max, 254] | min }}"
                          transition: !input wheel_transition

                  - alias: Absolute - colour temperature
                    conditions:
                      - condition: template
                        value_template: "{{ rot_mode == 'absolute' and scroll_mode == 'color_temp' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input wheel_lights
                        data:
                          color_temp_kelvin: >-
                            {% set mn = state_attr(ref_entity, 'min_color_temp_kelvin') | int(2000) %}
                            {% set mx = state_attr(ref_entity, 'max_color_temp_kelvin') | int(6500) %}
                            {{ (mn + ((wheel_level - 1) / 254) * (mx - mn)) | round(0) | int }}
                          transition: !input wheel_transition

                  - alias: Absolute - hue
                    conditions:
                      - condition: template
                        value_template: "{{ rot_mode == 'absolute' and scroll_mode == 'hue' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input wheel_lights
                        data:
                          hs_color:
                            - "{{ (((wheel_level - 1) / 254) * 360) | round(1) }}"
                            - >-
                              {% set hs = state_attr(ref_entity, 'hs_color') %}
                              {{ (hs[1] if hs else 100) | float(100) | round(1) }}
                          transition: !input wheel_transition

                  # ---- RELATIVE: step proportionally to how far you turned ----
                  - alias: Relative - brightness
                    conditions:
                      - condition: template
                        value_template: "{{ rot_mode == 'relative' and scroll_mode == 'brightness' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input wheel_lights
                        data:
                          brightness: >-
                            {% set cur = state_attr(ref_entity, 'brightness') | int(0) %}
                            {% set nxt = (cur + frac * 254 * (sens_bri | int(100)) / 100) | round(0) | int %}
                            {{ [[nxt, min_bri | int(1)] | max, 254] | min }}
                          transition: !input wheel_transition

                  - alias: Relative - colour temperature
                    conditions:
                      - condition: template
                        value_template: "{{ rot_mode == 'relative' and scroll_mode == 'color_temp' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input wheel_lights
                        data:
                          color_temp_kelvin: >-
                            {% set mn = state_attr(ref_entity, 'min_color_temp_kelvin') | int(2000) %}
                            {% set mx = state_attr(ref_entity, 'max_color_temp_kelvin') | int(6500) %}
                            {% set cur = state_attr(ref_entity, 'color_temp_kelvin') | int(((mn + mx) / 2) | int) %}
                            {% set nxt = (cur + frac * (mx - mn) * (sens_ct | int(100)) / 100) | round(0) | int %}
                            {{ [[nxt, mn] | max, mx] | min }}
                          transition: !input wheel_transition

                  - alias: Relative - hue
                    conditions:
                      - condition: template
                        value_template: "{{ rot_mode == 'relative' and scroll_mode == 'hue' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input wheel_lights
                        data:
                          hs_color:
                            - >-
                              {% set hs = state_attr(ref_entity, 'hs_color') %}
                              {% set h = (hs[0] if hs else 0) | float(0) %}
                              {{ ((h + frac * 360 * (sens_hue | int(100)) / 100) % 360) | round(1) }}
                            - >-
                              {% set hs = state_attr(ref_entity, 'hs_color') %}
                              {{ (hs[1] if hs else 100) | float(100) | round(1) }}
                          transition: !input wheel_transition
          - alias: Custom rotation actions
            sequence: !input wheel_actions
    default: []
