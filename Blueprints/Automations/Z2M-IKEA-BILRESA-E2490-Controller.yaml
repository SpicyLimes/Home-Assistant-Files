blueprint:
  name: IKEA BILRESA Remote with Scroll Wheel (Zigbee2MQTT)
  description: |
    Control actions for the IKEA BILRESA remote with scroll wheel (E2490) via Zigbee2MQTT.

    ------------------------------------------------------------------------
    Remote Behavior
    ------------------------------------------------------------------------

    The scroll wheel is the only control that reports to Zigbee2MQTT. It works as both a dial and a clickable button. The small bottom button sends nothing to the network; it only cycles which bound group the remote controls locally.

      | Input          | Zigbee2MQTT Action             |
      | -------------- | ------------------------------ |
      | Single click   | Alternating "on" / "off"       |
      | Double click   | "on_double"                    |
      | Triple click   | "off_double"                   |
      | Quad+ / long   | Nothing                        |
      | Rotate         | n x "brightness_move_to_level" |
      | Bottom button  | Nothing                        |

    Single clicks alternate. The remote stores an on/off state per channel and sends "on", then "off", then "on" again; it never sends a toggle. This keeps group members in sync with each other, but it falls out of sync if you also control the lights from Home Assistant.

      - For behavior that survives this, put light.toggle in "Wheel - Any Single Click" and leave the On Phase and Off Phase slots empty.
      - For strict on/off, use the "Wheel - Single Click, On Phase" and "Wheel - Single Click, Off Phase" slots instead.

    ------------------------------------------------------------------------
    Rotation: Absolute vs. Relative
    ------------------------------------------------------------------------

    Absolute (the default) uses the level the remote reports (1-255) directly, so the wheel behaves as a dial with a fixed position. It is simple and needs no extra setup, but the remote does not know if you changed the light elsewhere, so the next turn snaps back to the remote's own stored position.

    Relative steps up or down by how far you turned, so it never snaps and never falls out of sync. A quick flick moves further than a slow nudge.

    *** RELATIVE MODE REQUIRES ONE SETTING IN ZIGBEE2MQTT ***
    Open the device in Zigbee2MQTT, go to Settings (specific), and enter values in the "Simulated brightness" Delta and Interval fields (20 and 100 work well). There is no checkbox; the feature is enabled once the values are set. Zigbee2MQTT then adds "action_brightness_delta" to every rotation payload, which is what relative mode reads. Without it, relative mode does nothing. This device ignores the Delta and Interval values themselves; only devices that send brightness_move_up/down use them.

    Relative mode handles two measured quirks for you:
      - The first rotation after a Zigbee2MQTT restart reports a bogus delta, because it is compared against a starting value of 255. "Relative - Max Delta" limits the damage to a single oversized step.
      - At either end of its range, the remote clamps at 255 or 1 and keeps transmitting with a delta of 0. The level is used to infer the direction there, and "Relative - Rail Step" sets how far each of those events moves.

    ------------------------------------------------------------------------
    Scroll Modes
    ------------------------------------------------------------------------

    The wheel can control brightness, color temperature, or hue. Point "Scroll Mode - Helper" at an input_select whose options are any of:

        brightness    color_temp    hue

    Turn on "Scroll Mode - Triple Click Cycles" and a triple click advances to the next option, wrapping around at the end. Double click stays free for your own actions.

    Without a helper, the mode is fixed to "Scroll Mode - Fallback".

    Color temperature and hue modes read the current value from the first entity in your rotation target, so that target must include at least one entity (not only areas or devices).

    ------------------------------------------------------------------------
    Other Notes and FYI's
    ------------------------------------------------------------------------

      - The wheel has low click sensitivity, so press firmly.
      - Clicks have a built-in delay of about 0.5 seconds while the remote decides between single, double, and triple.
      - The remote sleeps to save power and will not respond to Zigbee2MQTT commands until a button press wakes it.

  author: SpicyLimes
  source_url: https://github.com/SpicyLimes/Home-Assistant-Files/blob/main/Blueprints/Automations/Z2M-IKEA-BILRESA-E2490-Controller.yaml
  domain: automation
  input:
    remote_topic:
      name: Zigbee2MQTT State Topic
      description: >
        The MQTT state topic for this remote: the Zigbee2MQTT base topic plus the
        device's friendly name, e.g. "zigbee2mqtt/My Remote Name". Do not include a
        trailing slash or "/action".
      selector:
        text:

    any_click_actions:
      name: Wheel - Any Single Click
      description: >
        Runs on every single click of the wheel, whether the remote sent "on" or
        "off". Pair it with light.toggle so the remote cannot fall out of step with
        the lights.
      default: []
      selector:
        action: {}

    on_actions:
      name: Wheel - Single Click, On Phase
      description: Runs only when a single click sends "on".
      default: []
      selector:
        action: {}

    off_actions:
      name: Wheel - Single Click, Off Phase
      description: Runs only when a single click sends "off".
      default: []
      selector:
        action: {}

    on_double_actions:
      name: Wheel - Double Click
      description: Runs on a double click (Zigbee2MQTT reports this as "on_double").
      default: []
      selector:
        action: {}

    off_double_actions:
      name: Wheel - Triple Click
      description: >
        Runs on a triple click (Zigbee2MQTT reports this as "off_double").
        Ignored when "Scroll Mode - Triple Click Cycles" is on.
      default: []
      selector:
        action: {}

    rotation_mode:
      name: Rotation - Behavior
      description: >
        Absolute uses the reported level as a dial position. Relative steps by how
        far you turned and never falls out of sync, but requires Simulated
        Brightness to be enabled in Zigbee2MQTT (see the blueprint description).
      default: absolute
      selector:
        select:
          options:
            - label: Absolute - Dial position (no extra setup)
              value: absolute
            - label: Relative - Proportional steps (requires Simulated Brightness)
              value: relative

    wheel_lights:
      name: Rotation - Lights to Control
      description: >
        The lights the wheel adjusts. For color temperature and hue modes, this
        must include at least one entity, because the current value is read from
        the first one.
      default: {}
      selector:
        target:
          entity:
            domain: light

    wheel_transition:
      name: Rotation - Transition Time
      description: >
        Fade time in seconds. Keep it short; the remote sends events every
        100-300 ms while turning.
      default: 0.3
      selector:
        number:
          min: 0.0
          max: 5.0
          step: 0.1
          unit_of_measurement: seconds
          mode: slider

    scroll_mode_helper:
      name: Scroll Mode - Helper
      description: >
        Optional input_select whose options are any of: brightness, color_temp,
        hue. Leave empty to use the fallback mode below.
      default: ""
      selector:
        entity:
          domain: input_select

    fallback_scroll_mode:
      name: Scroll Mode - Fallback
      description: Used when no helper is set or the helper is unavailable.
      default: brightness
      selector:
        select:
          options:
            - label: Brightness
              value: brightness
            - label: Color Temperature
              value: color_temp
            - label: Hue
              value: hue

    cycle_mode_on_triple:
      name: Scroll Mode - Triple Click Cycles
      description: >
        When on, a triple click advances the helper to its next option, and the
        "Wheel - Triple Click" actions do not run.
      default: false
      selector:
        boolean:

    sensitivity_brightness:
      name: Sensitivity - Brightness
      description: >
        At 100%, one full sweep of the wheel covers the entire brightness range.
        Relative mode only.
      default: 100
      selector:
        number: {min: 10, max: 300, step: 5, unit_of_measurement: "%", mode: slider}

    sensitivity_color_temp:
      name: Sensitivity - Color Temperature
      description: >
        At 100%, one full sweep covers the light's entire Kelvin range. Relative
        mode only.
      default: 100
      selector:
        number: {min: 10, max: 300, step: 5, unit_of_measurement: "%", mode: slider}

    sensitivity_hue:
      name: Sensitivity - Hue
      description: >
        At 100%, one full sweep goes once around the color wheel. Relative mode
        only.
      default: 100
      selector:
        number: {min: 10, max: 300, step: 5, unit_of_measurement: "%", mode: slider}

    max_delta:
      name: Relative - Max Delta
      description: >
        Limits how far a single event can move, in the remote's 0-255 units. This
        is what contains the bogus first reading after a Zigbee2MQTT restart.
        Measured real turns ranged from about 14 (gentle) to 70 (fast).
      default: 60
      selector:
        number: {min: 5, max: 255, step: 5, mode: slider}

    rail_delta:
      name: Relative - Rail Step
      description: >
        How far to move per event while the wheel is pinned at its maximum or
        minimum, where the remote reports a delta of 0. Set to 0 to ignore those
        events.
      default: 10
      selector:
        number: {min: 0, max: 60, step: 1, mode: slider}

    min_brightness:
      name: Rotation - Minimum Brightness
      description: Scrolling down will not take the light below this level (1-254).
      default: 3
      selector:
        number: {min: 1, max: 254, step: 1, mode: slider}

    wheel_actions:
      name: Rotation - Custom Actions
      description: >
        Extra actions to run on each wheel movement. Available variables:
        wheel_level (1-255), raw_delta, direction (-1/0/1), frac (-1.0 to 1.0), and
        scroll_mode.
      default: []
      selector:
        action: {}

# The wheel emits a burst of events while turning. Queued keeps them in order so the
# final value matches where the wheel stopped; silent overflow avoids log spam.
mode: queued
max: 25
max_exceeded: silent

triggers:
  - trigger: mqtt
    topic: !input remote_topic
    id: remote

variables:
  wheel_targets: !input wheel_lights
  rot_mode: !input rotation_mode
  mode_helper: !input scroll_mode_helper
  fallback_mode: !input fallback_scroll_mode
  cycle_on_triple: !input cycle_mode_on_triple
  cap_delta: !input max_delta
  rail_step: !input rail_delta
  min_bri: !input min_brightness
  sens_bri: !input sensitivity_brightness
  sens_ct: !input sensitivity_color_temp
  sens_hue: !input sensitivity_hue

  # action_level exists ONLY on rotation payloads, and action_brightness_delta only
  # when Simulated Brightness is enabled. Variables render BEFORE conditions, so
  # dereferencing either unguarded raises UndefinedError and silently aborts the
  # whole run for every click action. default(0) keeps these safe.
  wheel_level: "{{ (trigger.payload_json.action_level | default(0)) | int(0) }}"
  raw_delta: "{{ (trigger.payload_json.action_brightness_delta | default(0)) | int(0) }}"
  click_state: >-
    {{ trigger.payload_json.action if trigger.payload_json.action | default('') in ['on', 'off'] else '' }}

  # First entity of the rotation target, used to read the current color temp / hue.
  ref_entity: >-
    {% set ids = (wheel_targets | default({}, true)).entity_id | default([]) %}
    {% set ids = [ids] if ids is string else ids %}
    {{ ids[0] if (ids | count) > 0 else '' }}

  scroll_mode: >-
    {{ states(mode_helper) if mode_helper not in [none, ''] and states(mode_helper) in ['brightness', 'color_temp', 'hue'] else fallback_mode }}

  # +1 up, -1 down, 0 ignore. At the rails the remote reports delta 0 while still
  # transmitting, so the clamped level tells us which way it is pinned.
  direction: >-
    {{ 1 if raw_delta > 0 else (-1 if raw_delta < 0 else (1 if wheel_level >= 255 else (-1 if wheel_level <= 1 else 0))) }}

  # Magnitude in 0-255 units, capped; rails substitute the fixed rail step.
  eff_delta: >-
    {{ (rail_step | int(0)) if raw_delta == 0 else ([(raw_delta | abs), (cap_delta | int(60))] | min) }}

  # Signed fraction of full scale, -1.0 .. 1.0
  frac: "{{ (direction | int(0)) * (eff_delta | int(0)) / 255 }}"

conditions:
  # This topic also carries battery and link-quality updates with no action.
  - condition: template
    value_template: >
      {{ trigger.payload_json.action is defined
         and trigger.payload_json.action not in [none, ''] }}

actions:
  - choose:
      # Single clicks alternate on/off. The "any click" slot runs inside BOTH
      # phases. Note: an empty `sequence:` is valid, but an empty `then:` is not,
      # so these must be nested sequences rather than an if/then wrapper.
      - alias: Single click - on phase
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'on' }}"
        sequence:
          - alias: Any single click
            sequence: !input any_click_actions
          - alias: On phase only
            sequence: !input on_actions

      - alias: Single click - off phase
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'off' }}"
        sequence:
          - alias: Any single click
            sequence: !input any_click_actions
          - alias: Off phase only
            sequence: !input off_actions

      - alias: Double click
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'on_double' }}"
        sequence: !input on_double_actions

      - alias: Triple click - cycle scroll mode, or run the triple click actions
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'off_double' }}"
        sequence:
          - if:
              - condition: template
                value_template: "{{ cycle_on_triple and mode_helper not in [none, ''] }}"
            then:
              # Templated rather than `!input` directly: the input defaults to an
              # empty string, and HA validates entity_id at blueprint-instantiation
              # time, which would make every automation using the defaults fail to
              # load. A template defers resolution to runtime, behind the guard above.
              - action: input_select.select_next
                target:
                  entity_id: "{{ mode_helper }}"
                data:
                  cycle: true
            else:
              - alias: Triple click actions
                sequence: !input off_double_actions

      - alias: Wheel rotation
        conditions:
          - condition: template
            value_template: "{{ trigger.payload_json.action == 'brightness_move_to_level' }}"
        sequence:
          - alias: Apply the rotation to the selected lights
            if:
              - condition: template
                value_template: >
                  {{ (wheel_targets | default({}, true) | count > 0)
                     and (rot_mode == 'absolute' or (direction | int(0)) != 0) }}
            then:
              - choose:
                  # ---- ABSOLUTE: the reported level is the dial position ----
                  - alias: Absolute - brightness
                    conditions:
                      - condition: template
                        value_template: "{{ rot_mode == 'absolute' and scroll_mode == 'brightness' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input wheel_lights
                        data:
                          # The remote can report 255, undefined for lights; 254 is max.
                          brightness: "{{ [[wheel_level, min_bri | int(1)] | max, 254] | min }}"
                          transition: !input wheel_transition

                  - alias: Absolute - color temperature
                    conditions:
                      - condition: template
                        value_template: "{{ rot_mode == 'absolute' and scroll_mode == 'color_temp' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input wheel_lights
                        data:
                          color_temp_kelvin: >-
                            {% set mn = state_attr(ref_entity, 'min_color_temp_kelvin') | int(2000) %}
                            {% set mx = state_attr(ref_entity, 'max_color_temp_kelvin') | int(6500) %}
                            {{ (mn + ((wheel_level - 1) / 254) * (mx - mn)) | round(0) | int }}
                          transition: !input wheel_transition

                  - alias: Absolute - hue
                    conditions:
                      - condition: template
                        value_template: "{{ rot_mode == 'absolute' and scroll_mode == 'hue' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input wheel_lights
                        data:
                          hs_color:
                            - "{{ (((wheel_level - 1) / 254) * 360) | round(1) }}"
                            - >-
                              {% set hs = state_attr(ref_entity, 'hs_color') %}
                              {{ (hs[1] if hs else 100) | float(100) | round(1) }}
                          transition: !input wheel_transition

                  # ---- RELATIVE: step proportionally to how far you turned ----
                  - alias: Relative - brightness
                    conditions:
                      - condition: template
                        value_template: "{{ rot_mode == 'relative' and scroll_mode == 'brightness' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input wheel_lights
                        data:
                          brightness: >-
                            {% set cur = state_attr(ref_entity, 'brightness') | int(0) %}
                            {% set nxt = (cur + frac * 254 * (sens_bri | int(100)) / 100) | round(0) | int %}
                            {{ [[nxt, min_bri | int(1)] | max, 254] | min }}
                          transition: !input wheel_transition

                  - alias: Relative - color temperature
                    conditions:
                      - condition: template
                        value_template: "{{ rot_mode == 'relative' and scroll_mode == 'color_temp' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input wheel_lights
                        data:
                          color_temp_kelvin: >-
                            {% set mn = state_attr(ref_entity, 'min_color_temp_kelvin') | int(2000) %}
                            {% set mx = state_attr(ref_entity, 'max_color_temp_kelvin') | int(6500) %}
                            {% set cur = state_attr(ref_entity, 'color_temp_kelvin') | int(((mn + mx) / 2) | int) %}
                            {% set nxt = (cur + frac * (mx - mn) * (sens_ct | int(100)) / 100) | round(0) | int %}
                            {{ [[nxt, mn] | max, mx] | min }}
                          transition: !input wheel_transition

                  - alias: Relative - hue
                    conditions:
                      - condition: template
                        value_template: "{{ rot_mode == 'relative' and scroll_mode == 'hue' }}"
                    sequence:
                      - action: light.turn_on
                        target: !input wheel_lights
                        data:
                          hs_color:
                            - >-
                              {% set hs = state_attr(ref_entity, 'hs_color') %}
                              {% set h = (hs[0] if hs else 0) | float(0) %}
                              {{ ((h + frac * 360 * (sens_hue | int(100)) / 100) % 360) | round(1) }}
                            - >-
                              {% set hs = state_attr(ref_entity, 'hs_color') %}
                              {{ (hs[1] if hs else 100) | float(100) | round(1) }}
                          transition: !input wheel_transition
          - alias: Custom rotation actions
            sequence: !input wheel_actions
    default: []
